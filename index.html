<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Element Modeler - Ver.1.1.0</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=1.1.0">
</head>
<body>
  <!-- Left Toolbar -->
  <aside id="toolbar">
    <div id="toolbar-quick" class="toolbar-sticky-top">
      <h2 data-i18n="tools">ツール</h2>
      <button id="btn-settings">&#9881; <span data-i18n="settings">設定</span></button>
      <span class="layer-label" data-i18n="activeLayer">レイヤー</span>
      <div class="layer-controls">
        <select id="sel-active-layer"></select>
        <button id="btn-layer-manage" class="layer-manage-btn" title="Layer Management">&#9881;</button>
      </div>
      <span class="layer-label" data-i18n="toolLabel">要素</span>
      <div class="layer-controls">
        <select id="sel-tool">
          <option value="select" data-i18n="selectTool">選択</option>
          <option value="member" data-i18n="member">線材</option>
          <option value="surface" data-i18n="surface">面材</option>
          <option value="load" data-i18n="load">荷重</option>
          <option value="support" data-i18n="support">支点</option>
          <option value="measure" data-i18n="measureTool">計測</option>
        </select>
      </div>
      <div class="layer-controls">
        <button id="btn-axes-manage" title="Grid axes">&#9881; <span data-i18n="axesManage">通り芯管理</span></button>
      </div>
      <hr>
    </div>
    <div id="tool-opts-member" class="tool-opts">
      <label class="grid-label">
        <span data-i18n="draftMemberType">線材種別</span>
        <select id="sel-member-type">
          <option value="beam" data-i18n="beam">梁</option>
          <option value="column" data-i18n="column">柱</option>
          <option value="hbrace" data-i18n="hbrace">水平ブレース</option>
          <option value="vbrace" data-i18n="vbrace">垂直ブレース</option>
        </select>
      </label>
      <label class="grid-label">
        <span data-i18n="draftSection">断面（貼り付け）</span>
        <select id="sel-member-section"></select>
      </label>
      <div id="member-layer-hint" class="tool-hint"></div>
    </div>
    <div id="tool-opts-surface" class="tool-opts">
      <label class="grid-label">
        <span data-i18n="draftSurfaceType">面材種別</span>
        <select id="sel-surface-type">
          <option value="floor" data-i18n="floor">床</option>
          <option value="exteriorWall" data-i18n="exteriorWall">外壁</option>
          <option value="wall" data-i18n="wall">壁</option>
          <option value="roof" data-i18n="roof">屋根</option>
          <option value="eave" data-i18n="eave">庇/軒</option>
          <option value="gableWall" data-i18n="gableWall">妻壁</option>
        </select>
      </label>
      <label class="grid-label">
        <span data-i18n="draftSection">断面（貼り付け）</span>
        <select id="sel-surface-section"></select>
      </label>
      <label id="label-surface-mode" class="grid-label">
        <span data-i18n="surfaceMode">配置方法</span>
        <select id="sel-surface-mode">
          <option value="rect" data-i18n="rectMode">矩形</option>
          <option value="polyline" data-i18n="polylineMode">ポリライン</option>
        </select>
      </label>
      <label id="label-load-direction" class="grid-label">
        <span data-i18n="loadDirection">荷重方向</span>
        <select id="sel-load-direction">
          <option value="x">X</option>
          <option value="y">Y</option>
          <option value="twoWay" data-i18n="twoWay">2方向</option>
        </select>
      </label>
      <label id="label-top-layer" class="grid-label">
        <span data-i18n="topLayer">上端レイヤー</span>
        <select id="sel-top-layer"></select>
      </label>
      <label id="label-wall-height-mode" class="grid-label">
        <span data-i18n="wallHeightMode">壁高さ</span>
        <select id="sel-wall-height-mode">
          <option value="full" data-i18n="wallHeightFull">全高</option>
          <option value="waist" data-i18n="wallHeightWaist">腰壁</option>
          <option value="hanging" data-i18n="wallHeightHanging">垂れ壁</option>
          <option value="custom" data-i18n="wallHeightCustom">任意</option>
        </select>
      </label>
      <label id="label-wall-bottom-offset" class="grid-label">
        <span data-i18n="wallBottomOffset">下端</span>
        <input id="input-wall-bottom-offset" type="number" step="100" value="0">
      </label>
      <label id="label-wall-top-offset" class="grid-label">
        <span data-i18n="wallTopOffset">上端</span>
        <input id="input-wall-top-offset" type="number" step="100" value="1200">
      </label>
      <label id="label-roof-slope" class="grid-label">
        <span data-i18n="roofSlope">屋根勾配</span>
        <input id="input-roof-slope" type="number" min="0" step="0.01" value="0.3">
      </label>
      <label id="label-roof-direction" class="grid-label">
        <span data-i18n="roofDirection">登り方向</span>
        <select id="sel-roof-direction">
          <option value="xPlus" data-i18n="roofDirXPlus">+X</option>
          <option value="xMinus" data-i18n="roofDirXMinus">-X</option>
          <option value="yPlus" data-i18n="roofDirYPlus">+Y</option>
          <option value="yMinus" data-i18n="roofDirYMinus">-Y</option>
        </select>
      </label>
      <label id="label-roof-base-offset" class="grid-label">
        <span data-i18n="roofBaseOffset">基準高さ</span>
        <input id="input-roof-base-offset" type="number" step="100" value="0">
      </label>
      <label id="label-roof-group-id" class="grid-label">
        <span data-i18n="roofGroupId">屋根グループ</span>
        <input id="input-roof-group-id" type="text" value="RG1">
      </label>
    </div>
    <div id="tool-opts-load" class="tool-opts">
      <label class="grid-label">
        <span data-i18n="draftLoadType">荷重種別</span>
        <select id="sel-load-type">
          <option value="areaLoad" data-i18n="areaLoad">面荷重</option>
          <option value="lineLoad" data-i18n="lineLoad">線荷重</option>
          <option value="pointLoad" data-i18n="pointLoad">点荷重</option>
        </select>
      </label>
      <label class="grid-label">
        <span data-i18n="loadCaseLabel">荷重ケース</span>
        <select id="sel-load-case">
          <option value="DL">DL</option>
          <option value="LL">LL</option>
          <option value="EQX">EQX</option>
          <option value="EQY">EQY</option>
          <option value="WX">WX</option>
          <option value="WY">WY</option>
        </select>
      </label>
    </div>
    <hr>
    <label class="toggle-label">
      <input type="checkbox" id="chk-snap" checked>
      <span data-i18n="snap">スナップ</span>
    </label>
    <label class="toggle-label">
      <input type="checkbox" id="chk-show-supports" checked>
      <span data-i18n="showSupports">支点表示</span>
    </label>
    <label class="toggle-label">
      <input type="checkbox" id="chk-wide-pick">
      <span data-i18n="widePick">広域選択</span>
    </label>
    <label class="toggle-label">
      <input type="checkbox" id="chk-show-axes" checked>
      <span data-i18n="showAxes">通り芯表示</span>
    </label>
    <label class="toggle-label">
      <input type="checkbox" id="chk-show-underlay" checked>
      <span data-i18n="showUnderlay">下絵表示</span>
    </label>
    <label class="grid-label">
      <span data-i18n="displayPreset">表示プリセット</span>
      <select id="sel-display-preset">
        <option value="input" data-i18n="displayPresetInput">入力用</option>
        <option value="review" data-i18n="displayPresetReview">確認用</option>
        <option value="presentation" data-i18n="displayPresetPresentation">3D確認用</option>
      </select>
    </label>
    <label class="grid-label">
      <span data-i18n="planLayerDisplayMode">2Dレイヤー表示</span>
      <select id="sel-plan-layer-display-mode">
        <option value="all" data-i18n="planLayerAll">全レイヤー</option>
        <option value="current" data-i18n="planLayerCurrent">現在のみ</option>
        <option value="halftone" data-i18n="planLayerHalftone">他レイヤー薄表示</option>
      </select>
    </label>
    <label class="toggle-label">
      <input type="checkbox" id="chk-plan-layer-selection-lock">
      <span data-i18n="planLayerSelectionLock">他レイヤー選択ロック</span>
    </label>
    <label class="grid-label">
      <span data-i18n="view3dLayerDisplayMode">3Dレイヤー表示</span>
      <select id="sel-3d-layer-display-mode">
        <option value="all" data-i18n="planLayerAll">全レイヤー</option>
        <option value="current" data-i18n="planLayerCurrent">現在のみ</option>
        <option value="halftone" data-i18n="planLayerHalftone">他レイヤー薄表示</option>
      </select>
    </label>
    <label class="grid-label">
      <span data-i18n="member3dRenderMode">3D線材表示</span>
      <select id="sel-member-3d-render-mode">
        <option value="solid" data-i18n="member3dSolid">断面形状</option>
        <option value="line" data-i18n="member3dLine">線表示</option>
      </select>
    </label>
    <label class="grid-label">
      <span data-i18n="beam3dSectionMode">梁3D断面</span>
      <select id="sel-beam-3d-section-mode">
        <option value="box" data-i18n="beam3dBox">ボックス</option>
        <option value="hStrong" data-i18n="beam3dHStrong">H形鋼（強軸）</option>
        <option value="hWeak" data-i18n="beam3dHWeak">H形鋼（弱軸）</option>
      </select>
    </label>
    <div class="tool-filter-group">
      <span class="layer-label" data-i18n="displayFilters">表示フィルタ</span>
      <label class="toggle-label compact-toggle">
        <input type="checkbox" id="chk-show-members" checked>
        <span data-i18n="member">線材</span>
      </label>
      <label class="toggle-label compact-toggle">
        <input type="checkbox" id="chk-show-surfaces" checked>
        <span data-i18n="surface">面材</span>
      </label>
      <label class="toggle-label compact-toggle">
        <input type="checkbox" id="chk-show-loads" checked>
        <span data-i18n="load">荷重</span>
      </label>
      <label class="toggle-label compact-toggle">
        <input type="checkbox" id="chk-show-member-end-symbols">
        <span data-i18n="showMemberEndSymbols">材端記号</span>
      </label>
      <label class="toggle-label compact-toggle">
        <input type="checkbox" id="chk-show-placement-labels" checked>
        <span data-i18n="showPlacementLabels">配置ラベル</span>
      </label>
    </div>
    <label class="grid-label">
      <span data-i18n="memberTypeFilter">線材種別フィルタ</span>
      <select id="sel-member-type-filter">
        <option value="all" data-i18n="filterAll">すべて</option>
        <option value="beam" data-i18n="beam">梁</option>
        <option value="column" data-i18n="column">柱</option>
        <option value="hbrace" data-i18n="hbrace">水平ブレース</option>
        <option value="vbrace" data-i18n="vbrace">垂直ブレース</option>
      </select>
    </label>
    <label class="grid-label">
      <span data-i18n="sectionFilter">断面フィルタ</span>
      <select id="sel-section-filter">
        <option value="all" data-i18n="filterAll">すべて</option>
      </select>
    </label>
    <label class="grid-label">
      <span data-i18n="grid">グリッド (mm)</span>
      <input type="number" id="sel-grid" min="100" max="1000" step="1" value="1000">
    </label>
    <hr>
    <div class="tool-filter-group">
      <span class="layer-label" data-i18n="copyLevelTitle">階コピー</span>
      <label class="grid-label">
        <span data-i18n="copyLevelSource">コピー元</span>
        <select id="sel-copy-source-layer"></select>
      </label>
      <label class="grid-label">
        <span data-i18n="copyLevelTarget">コピー先</span>
        <select id="sel-copy-target-layer"></select>
      </label>
      <button id="btn-copy-level" title="Copy level elements"><span data-i18n="copyLevelAction">階をコピー</span></button>
    </div>
    <hr>
    <button id="btn-export" title="Save CAD data">&#128190; <span data-i18n="export">CAD保存</span></button>
    <button id="btn-import-trigger" title="Load CAD data">&#128194; <span data-i18n="import">CAD読込</span></button>
    <input type="file" id="file-import" accept=".json" hidden>
    <hr>
    <button id="btn-analysis-export" title="Export analysis model (JSON)">&#128640; <span data-i18n="analysisExport">解析JSON出力</span></button>
    <button id="btn-analysis-csv-export" title="Export analysis model (CSV)">&#128640; <span data-i18n="analysisCsvExport">解析CSV出力</span></button>
    <button id="btn-dxf-export" title="Export plan DXF">&#128196; <span data-i18n="dxfExport">図面DXF出力</span></button>
    <button id="btn-png-export" title="Export plan PNG">&#128247; <span data-i18n="pngExport">PNG出力</span></button>
    <hr>
    <button id="btn-underlay-import" title="Import DXF underlay">&#128209; <span data-i18n="underlayImport">下絵DXF読込</span></button>
    <button id="btn-underlay-clear" title="Clear underlay">&#128465; <span data-i18n="underlayClear">下絵クリア</span></button>
    <input type="file" id="file-underlay-import" accept=".dxf" hidden>
  </aside>
  <div id="toolbar-resizer" class="side-resizer side-resizer-left" role="separator" aria-label="Resize toolbar" aria-orientation="vertical">
    <button id="btn-toggle-toolbar" class="panel-toggle-btn" type="button" aria-label="Hide toolbar" title="ツールパネルを隠す">‹</button>
  </div>

  <!-- Main Area -->
  <main id="main-area">
    <!-- View Tabs -->
    <nav id="view-tabs">
      <button id="tab-2d" class="tab-btn active" data-i18n="tab2d">2D CAD</button>
      <button id="tab-3d" class="tab-btn" data-i18n="tab3d">3D 表示</button>
      <button id="btn-elevation-open" class="tab-btn" data-i18n="elevationOpen">軸組図</button>
    </nav>

    <!-- Canvas Container -->
    <div id="canvas-container">
      <canvas id="canvas-2d"></canvas>
      <div id="viewer-3d" hidden></div>
    </div>

    <!-- Status Bar -->
    <footer id="status-bar">
      <span id="status-coords">X: 0  Y: 0</span>
      <span id="status-snap" data-i18n="snapOn">スナップ: ON</span>
      <span id="status-zoom">Zoom: 100%</span>
      <span id="status-tool" data-i18n="toolMember">ツール: 線材</span>
      <span id="status-version">Ver.1.1.0</span>
    </footer>
  </main>
  <div id="property-resizer" class="side-resizer side-resizer-right" role="separator" aria-label="Resize properties" aria-orientation="vertical">
    <button id="btn-toggle-property" class="panel-toggle-btn" type="button" aria-label="Hide properties" title="プロパティパネルを隠す">›</button>
  </div>

  <!-- Right Property Panel -->
  <aside id="property-panel">
    <h2 data-i18n="properties">プロパティ</h2>
    <div id="prop-content">
      <p class="prop-placeholder" data-i18n="noSelection">未選択</p>
    </div>
    <h2 data-i18n="quantitySummary">集計</h2>
    <button id="btn-model-check" class="support-preset-btn" data-i18n="modelCheck">モデルチェック</button>
    <button id="btn-merge-nodes" class="support-preset-btn" data-i18n="mergeNodes">節点マージ</button>
    <button id="btn-split-members" class="support-preset-btn" data-i18n="splitMembers">交差部材を分割</button>
    <div id="model-check-content"></div>
    <button id="btn-quantity-export" class="support-preset-btn" data-i18n="quantityCsvExport">CSV出力</button>
    <button id="btn-quantity-detail-export" class="support-preset-btn" data-i18n="quantityDetailCsvExport">詳細CSV出力</button>
    <div id="quantity-content"></div>
  </aside>

  <!-- Help Modal -->
  <div id="help-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 data-i18n="helpTitle">簡易マニュアル</h2>
        <button id="btn-help-close" class="modal-close" data-i18n="helpClose">閉じる</button>
      </div>
      <div id="help-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content modal-settings">
      <div class="modal-header">
        <h2 data-i18n="settingsTitle">設定</h2>
        <button id="btn-settings-close" class="modal-close" data-i18n="helpClose">閉じる</button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <label data-i18n="themeLabel">テーマ</label>
          <select id="settings-theme">
            <option value="dark" data-i18n="themeDark">ダーク</option>
            <option value="light" data-i18n="themeLight">ライト</option>
          </select>
        </div>
        <div class="settings-group">
          <label data-i18n="langLabel">言語</label>
          <select id="settings-lang">
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </div>
        <hr>
        <button id="btn-open-user-def" class="settings-help-btn">&#9881; <span data-i18n="userDefManage">ユーザー定義</span></button>
        <button id="btn-open-combos" class="settings-help-btn stack-gap">&#9878; <span data-i18n="comboManage">荷重組合せ</span></button>
        <hr>
        <div class="settings-group">
          <label data-i18n="sampleModels">サンプルモデル</label>
        </div>
        <button id="btn-sample-gable" class="settings-help-btn">&#127968; <span data-i18n="sampleGable">平屋+切妻屋根</span></button>
        <button id="btn-sample-frame" class="settings-help-btn stack-gap">&#127970; <span data-i18n="sampleFrame">2階建フレーム</span></button>
        <hr>
        <button id="btn-open-help" class="settings-help-btn">&#10067; <span data-i18n="help">ヘルプ</span></button>
      </div>
    </div>
  </div>

  <!-- User Definition Modal -->
  <div id="user-def-modal" class="modal-overlay">
    <div class="modal-content modal-settings">
      <div class="modal-header">
        <h2 data-i18n="userDefTitle">ユーザー定義</h2>
        <button id="btn-user-def-close" class="modal-close" data-i18n="helpClose">閉じる</button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <label data-i18n="userDefKind">定義種別</label>
          <select id="user-def-kind">
            <option value="section" data-i18n="userDefSection">断面定義</option>
            <option value="spring" data-i18n="userDefSpring">バネ定義</option>
          </select>
        </div>

        <div id="user-def-section-group">
          <div class="settings-group">
            <label data-i18n="userDefTarget">対象</label>
            <select id="user-def-target">
              <option value="member" data-i18n="userDefTargetMember">線材</option>
              <option value="surface" data-i18n="userDefTargetSurface">面材</option>
            </select>
          </div>
          <div class="settings-group">
            <label data-i18n="userDefType">種別</label>
            <select id="user-def-type"></select>
          </div>
          <div class="settings-group">
            <label data-i18n="userDefName">名称</label>
            <input id="user-def-name" type="text" placeholder="U1">
          </div>
          <div class="settings-group">
            <label data-i18n="userDefColor">色</label>
            <input id="user-def-color" type="color" value="#666666">
          </div>
          <div id="user-def-size-group" class="prop-row">
            <div class="settings-group settings-group-grow">
              <label data-i18n="userDefWidthB">幅 b (mm)</label>
              <input id="user-def-b" type="number" min="1" step="1" value="100">
            </div>
            <div class="settings-group settings-group-grow">
              <label data-i18n="userDefHeightH">高さ h (mm)</label>
              <input id="user-def-h" type="number" min="1" step="1" value="100">
            </div>
          </div>
          <div id="user-def-end-preset-group" class="prop-row">
            <div class="settings-group settings-group-grow">
              <label data-i18n="userDefDefaultEndI">I端プリセット</label>
              <select id="user-def-endi-condition">
                <option value="pin" data-i18n="endPin">ピン</option>
                <option value="rigid" data-i18n="endRigid">剛</option>
                <option value="spring" data-i18n="endSpring">バネ</option>
              </select>
              <select id="user-def-endi-spring" hidden></select>
            </div>
            <div class="settings-group settings-group-grow">
              <label data-i18n="userDefDefaultEndJ">J端プリセット</label>
              <select id="user-def-endj-condition">
                <option value="pin" data-i18n="endPin">ピン</option>
                <option value="rigid" data-i18n="endRigid">剛</option>
                <option value="spring" data-i18n="endSpring">バネ</option>
              </select>
              <select id="user-def-endj-spring" hidden></select>
            </div>
          </div>
          <div class="settings-group">
            <label data-i18n="userDefMemo">メモ</label>
            <input id="user-def-section-memo" type="text" placeholder="">
          </div>
        </div>

        <div id="user-def-spring-group" hidden>
          <div class="settings-group">
            <label data-i18n="userDefName">名称</label>
            <input id="user-def-symbol" type="text" placeholder="SP1">
          </div>
          <div class="settings-group">
            <label data-i18n="userDefMemo">メモ</label>
            <input id="user-def-memo" type="text" placeholder="">
          </div>
        </div>

        <p id="user-def-form-error" class="form-error" hidden></p>

        <button id="btn-user-def-list" class="settings-help-btn">&#128065; <span data-i18n="userDefListOpen">同グループ一覧</span></button>
        <button id="btn-user-def-add" class="settings-help-btn stack-gap">&#10133; <span data-i18n="userDefAdd">追加</span></button>
        <hr>
        <button id="btn-user-def-export" class="settings-help-btn">&#128190; <span data-i18n="userDefExport">エクスポート</span></button>
        <button id="btn-user-def-import-trigger" class="settings-help-btn stack-gap">&#128194; <span data-i18n="userDefImport">インポート</span></button>
        <input type="file" id="file-user-def-import" accept=".json" hidden>
      </div>
    </div>
  </div>

  <!-- User Definition List Modal -->
  <div id="user-def-list-modal" class="modal-overlay">
    <div class="modal-content modal-user-def-list">
      <div class="modal-header">
        <h2 data-i18n="userDefListTitle">同グループ定義一覧</h2>
        <button id="btn-user-def-list-close" class="modal-close" data-i18n="helpClose">閉じる</button>
      </div>
      <div id="user-def-list-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Layer Management Modal -->
  <div id="layer-modal" class="modal-overlay">
    <div class="modal-content modal-layer">
      <div class="modal-header">
        <h2 data-i18n="layerManage">レイヤー管理</h2>
        <button id="btn-layer-close" class="modal-close" data-i18n="helpClose">閉じる</button>
      </div>
      <div class="modal-body">
        <div id="layer-list"></div>
        <p id="layer-form-error" class="form-error" hidden></p>
        <button id="btn-layer-add" class="settings-help-btn">+ <span data-i18n="layerAdd">追加</span></button>
      </div>
    </div>
  </div>

  <!-- Grid Axes Modal -->
  <div id="axes-modal" class="modal-overlay">
    <div class="modal-content modal-layer">
      <div class="modal-header">
        <h2 data-i18n="axesManage">通り芯管理</h2>
        <button id="btn-axes-close" class="modal-close" data-i18n="helpClose">閉じる</button>
      </div>
      <div class="modal-body">
        <div id="axes-list"></div>
        <div class="support-preset-row">
          <button id="btn-axes-add-x" class="settings-help-btn">+ <span data-i18n="axisAddX">X通りを追加</span></button>
          <button id="btn-axes-add-y" class="settings-help-btn">+ <span data-i18n="axisAddY">Y通りを追加</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Load Combination Modal -->
  <div id="combo-modal" class="modal-overlay">
    <div class="modal-content modal-combo">
      <div class="modal-header">
        <h2 data-i18n="comboManage">荷重組合せ</h2>
        <button id="btn-combo-close" class="modal-close" data-i18n="helpClose">閉じる</button>
      </div>
      <div class="modal-body">
        <div id="combo-list"></div>
        <button id="btn-combo-add" class="settings-help-btn">+ <span data-i18n="comboAdd">組合せを追加</span></button>
      </div>
    </div>
  </div>

  <!-- Join / Split Choice Modal -->
  <div id="join-section-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-content modal-settings" role="dialog" aria-modal="true" aria-labelledby="join-section-modal-title">
      <div class="modal-header">
        <h2 id="join-section-modal-title">選択</h2>
        <button id="btn-join-section-close" type="button" class="modal-close" data-i18n="choiceCancel">キャンセル</button>
      </div>
      <form id="join-section-form" class="modal-body">
        <div class="settings-group">
          <label for="join-section-choice" data-i18n="choicePrompt">選択肢</label>
          <select id="join-section-choice"></select>
        </div>
        <div class="support-preset-row">
          <button id="btn-join-section-cancel" type="button" class="support-preset-btn" data-i18n="choiceCancel">キャンセル</button>
          <button id="btn-join-section-confirm" type="submit" class="support-preset-btn" data-i18n="choiceConfirm">決定</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Elevation (Frame) Modal -->
  <div id="elevation-modal" class="modal-overlay">
    <div class="modal-content modal-elevation">
      <div class="modal-header">
        <h2 data-i18n="elevationTitle">軸組図</h2>
        <button id="btn-elevation-close" class="modal-close" data-i18n="helpClose">閉じる</button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <label data-i18n="elevationAxis">通り芯</label>
          <select id="elevation-axis"></select>
        </div>
        <p id="elevation-empty" class="quantity-note" hidden></p>
        <canvas id="elevation-canvas" class="elevation-canvas"></canvas>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/app.js?v=1.1.0"></script>
</body>
</html>
